<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebAR - Hiro Marker</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
        body{
            margin:0;
            overflow:hidden;
            font-family:Arial;
        }

        #title{
            position:absolute;
            top:10px;
            width:100%;
            text-align:center;
            color:white;
            font-size:24px;
            z-index:999;
            text-shadow:2px 2px 5px black;
        }
    </style>
</head>

<body>

<div id="title">
    Đưa Hiro Marker trước webcam
</div>

<a-scene
    embedded
    vr-mode-ui="enabled:false"
    renderer="logarithmicDepthBuffer: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled:false;">

    <!-- Marker Hiro -->
    <a-marker preset="hiro">

        <!-- Mô hình con hươu -->
        <a-entity
            gltf-model="assets/realistic_deer_3d_model_2.0_demo_free_download.glb"
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.25 0.25 0.25">
        </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
