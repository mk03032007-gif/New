<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Hươu 3D</title>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    /* Nút bấm kích hoạt camera thủ công */
    #start-btn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      padding: 12px 24px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="start-btn" onclick="requestCam()">BẤM ĐỂ BẬT CAMERA</button>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false;" 
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="deer" src="deer.glb"></a-asset-item>
    </a-assets>

    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>
    <a-entity type="directional" light="intensity: 1;" position="1 4 2"></a-entity>

    <a-marker preset="hiro">
      <a-entity 
        gltf-model="#deer" 
        scale="0.15 0.15 0.15" 
        position="0 0 0">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    function requestCam() {
      // Yêu cầu quyền camera trực tiếp từ trình duyệt
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(function(stream) {
          alert("Cấp quyền thành công! Hãy làm mới (Reload) trang web.");
          document.getElementById('start-btn').style.display = 'none';
        })
        .catch(function(err) {
          alert("Lỗi: Thiết bị hoặc trình duyệt đang chặn camera! Chi tiết: " + err);
        });
    }
  </script>

</body>
</html>
