<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
}
#text{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    color:white;
    font-size:22px;
    z-index:999;
}
</style>

</head>

<body>

<div id="text">
Đưa Hiro Marker trước camera
</div>

<a-scene
embedded
renderer="antialias: true;"
vr-mode-ui="enabled:false"
arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled:false;">

<a-assets>

<a-asset-item
id="deer"
src="./assets/realistic_deer_3d_model_2.0_demo_free_download.glb">
</a-asset-item>

</a-assets>

<a-marker preset="hiro">

<a-entity
gltf-model="#deer"
position="0 0 0"
rotation="-90 0 0"
scale="0.02 0.02 0.02">
</a-entity>

</a-marker>

<a-entity camera></a-entity>

</a-scene>

</body>
</html>
