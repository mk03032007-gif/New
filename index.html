<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Hươu 3D</title>
  
  <!-- Thư viện A-Frame & AR.js bản ổn định nhất -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Khai báo camera rõ ràng -->
  <a-scene embedded arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="deer" src="deer.glb"></a-asset-item>
    </a-assets>

    <!-- Đèn chiếu sáng -->
    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>

    <!-- Mã Hiro Marker -->
    <a-marker preset="hiro">
      <a-entity 
        gltf-model="#deer" 
        scale="0.1 0.1 0.1" 
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <!-- Thẻ camera bắt buộc -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
