<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAR Hươu 3D</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #title {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            z-index: 999;
            text-shadow: 2px 2px 5px black;
        }
    </style>

</head>

<body>

<div id="title">
Quét Hiro Marker để xem hươu 3D
</div>

<a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: true;"
    vr-mode-ui="enabled: false">

    <a-assets>

        <a-asset-item
            id="deer"
            src="./assets/realistic_deer_3d_model_2.0_demo_free_download.glb">
        </a-asset-item>

    </a-assets>

    <a-marker preset="hiro">

        <a-entity
            gltf-model="#deer"
            position="0 0 0"
            rotation="-90 0 0"
            scale="0.05 0.05 0.05">
        </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

</a-scene>

</body>
</html>
