<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Hươu 3D</title>
  
  <!-- Bộ thư viện chuẩn tương thích 100% với WebRTC Camera -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body style="margin: 0px; overflow: hidden;">

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="deer" src="deer.glb"></a-asset-item>
    </a-assets>

    <!-- Ánh sáng -->
    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>
    <a-entity type="directional" light="intensity: 1;" position="1 4 2"></a-entity>

    <!-- Khung nhận diện Hiro Marker -->
    <a-marker preset="hiro">
      <a-entity 
        gltf-model="#deer" 
        scale="0.1 0.1 0.1" 
        position="0 0 0"
        rotation="0 0 0">
      </a-entity>
    </a-marker>

    <!-- Camera nhận diện luồng webcam -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
