<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Hiro Marker - Con Hươu 3D</title>
  
  <!-- Dùng CDN ổn định hỗ trợ camera -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    embedded 
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="deerModel" src="deer.glb"></a-asset-item>
    </a-assets>

    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>
    <a-entity type="directional" light="intensity: 1;" position="1 4 2"></a-entity>

    <a-marker preset="hiro">
      <a-entity 
        gltf-model="#deerModel" 
        position="0 0 0" 
        scale="0.15 0.15 0.15">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
