<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Hiro Marker - Con Hươu 3D</title>
  
  <!-- Thư viện A-Frame và AR.js hỗ trợ Hiro Marker -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Khởi tạo cảnh AR nhận diện Marker -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Quản lý tài nguyên file 3D -->
    <a-assets>
      <a-asset-item id="deerModel" src="deer.glb"></a-asset-item>
    </a-assets>

    <!-- Ánh sáng cho mô hình không bị đen -->
    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>
    <a-entity type="directional" light="intensity: 1;" position="1 4 2"></a-entity>

    <!-- Định vị mô hình theo HIRO Marker -->
    <a-marker preset="hiro">
      <!-- 
        position: Vị trí (x y z)
        scale: Kích thước (chỉnh nhỏ lại 0.2 0.2 0.2 để không bị quá to bọc mất camera)
        animation-mixer: Chạy chuyển động nếu file glb có sẵn animation
      -->
      <a-entity 
        gltf-model="#deerModel" 
        position="0 0 0" 
        scale="0.2 0.2 0.2" 
        animation-mixer>
      </a-entity>
    </a-marker>

    <!-- Camera của thiết bị -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
