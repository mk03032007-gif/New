<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR Hươu 3D - MindAR</title>
  
  <!-- Thư viện A-Frame & MindAR mới nhất, không bị chặn Camera -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Khởi tạo AR sử dụng Camera -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="deerModel" src="deer.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Ánh sáng chiếu vào hươu -->
    <a-entity type="ambient" light="intensity: 1.5;"></a-entity>
    <a-entity type="directional" light="intensity: 1;" position="1 4 2"></a-entity>

    <!-- Vùng nhận diện mô hình -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity 
        gltf-model="#deerModel" 
        position="0 0 0" 
        scale="0.2 0.2 0.2" 
        rotation="0 0 0">
      </a-entity>
    </a-entity>

  </a-scene>

</body>
</html>
